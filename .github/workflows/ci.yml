name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Dependency audit (T5.4)
        run: pnpm audit --prod

      - name: Build
        run: pnpm build

      # Compatibility smoke against the real pinned dsh (T5.1/T5.4).
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh

      - name: Compatibility smoke suite
        run: pnpm test:smoke

      # E2E needs a GUI session; CI on macOS runners has one. The test skips
      # automatically when no window can be created (see shell.spec.ts).
      - name: E2E shell smoke
        run: pnpm --filter @dshd/desktop test:e2e

  package:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # macOS-only release package: prepare the self-contained runtime
      # (Node + dsh closure), then electron-builder produces the .dmg/.zip.
      # The packaged app needs no dsh/Node on the user's PATH (ADR-002).
      - name: Prepare self-contained runtime
        run: node apps/desktop/scripts/prepare-runtime.mjs --release

      - name: Package (macOS dmg + zip)
        run: pnpm --filter @dshd/desktop exec electron-builder --mac --config apps/desktop/electron-builder.yml

      - name: Verify packaged runtime (bundled node/dsh/patch/icon)
        run: node apps/desktop/scripts/verify-packaged-runtime.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-release
          path: apps/desktop/release/*

  package-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Windows release package: prepare the self-contained runtime on Windows
      # (node-win-x64 + @deepseek-ai/dsh with Windows prebuilds), then
      # electron-builder produces the NSIS installer (.exe) + zip.
      - name: Prepare self-contained runtime (Windows)
        run: node apps/desktop/scripts/prepare-runtime.mjs --release

      - name: Package (Windows NSIS + zip)
        run: pnpm --filter @dshd/desktop exec electron-builder --win --config apps/desktop/electron-builder.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-release
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
