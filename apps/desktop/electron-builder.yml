# Task 1.4 — electron-builder configuration.
# macOS-first: this project only builds and maintains the macOS target.
# (Windows/Linux packaging intentionally not configured.)
# Windows NSIS/zip targets are supported and built on Windows (CI windows
# job or a local Windows machine) — the self-contained runtime contains
# platform-native binaries, so a Windows package must be produced on Windows.

appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - resources/**/*
  - "!**/*.map"

# Self-contained dsh runtime (ADR-002 / Task 2.3): Node + @deepseek-ai/dsh
# installed by scripts/prepare-runtime.mjs --release. Lands at
# <resources>/runtime/ so dsh-bin.ts' bundledDescriptor() picks it up and the
# app needs no dsh/Node on the user's PATH.
extraResources:
  - from: build/runtime
    to: runtime
    filter: ['**/*']
  # The desktop-tools patch overlay must live OUTSIDE app.asar: the bundled
  # dsh child is a plain Node process and cannot read Electron's asar virtual
  # paths. Placing it under <resources>/desktop-tools.patch.yml makes
  # desktopPatchPath()'s first candidate resolve in packaged builds.
  - from: resources/desktop-tools.patch.yml
    to: desktop-tools.patch.yml
  # Host plugin + skills must live outside asar: the dsh child is plain Node
  # and the installer symlinks these real directories into ~/.dsh.
  - from: plugins/dsh-coding-agent
    to: plugins/dsh-coding-agent
  - from: plugins/desktop-chrome
    to: plugins/desktop-chrome
  - from: skills
    to: skills

# App icon (generated by scripts/icon-from-image.mjs): 1024px source + .icns.
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # code signing secrets land in CI; local builds run unsigned.
  identity: null
  # macOS-specific hardening (packaged app only).
  hardenedRuntime: true
  gatekeeperAssess: false

# Windows targets (built on Windows; see docs/windows-build-and-install.md).
# Icon generated by scripts/generate-icon.mjs (256×256 PNG-compressed ICO).
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip

# NSIS installer: per-user install with a directory chooser and desktop
# shortcut, so non-admin users can install without elevation.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: DeepSeek Harness Desktop
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
