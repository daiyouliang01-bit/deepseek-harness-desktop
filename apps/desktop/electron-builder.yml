# Task 1.4 — electron-builder configuration.
# Dev builds target the current OS only; the runtime (Node + dsh) is bundled
# per ADR-002 once Task 1.4's prepare-runtime lands (see scripts/prepare-runtime.mjs).

appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - resources/**/*
  - "!**/*.map"

# Self-contained dsh runtime (ADR-002 / Task 2.3): Node + @deepseek-ai/dsh
# installed by scripts/prepare-runtime.mjs --release. Lands at
# <resources>/runtime/ so dsh-bin.ts' bundledDescriptor() picks it up and the
# app needs no dsh/Node on the user's PATH.
extraResources:
  - from: build/runtime
    to: runtime
    filter: ['**/*']
  # The desktop-tools patch overlay must live OUTSIDE app.asar: the bundled
  # dsh child is a plain Node process and cannot read Electron's asar virtual
  # paths. Placing it under <resources>/desktop-tools.patch.yml makes
  # desktopPatchPath()'s first candidate resolve in packaged builds.
  - from: resources/desktop-tools.patch.yml
    to: desktop-tools.patch.yml

# App icon (generated by scripts/generate-icon.mjs): 512px PNG + .icns.
# Windows uses the 512px PNG (electron-builder converts to .ico automatically).

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # code signing secrets land in CI (Task 5.2); local builds run unsigned.
  identity: null

win:
  icon: build/icon.png
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
