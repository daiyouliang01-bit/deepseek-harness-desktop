# Task 1.4 — electron-builder configuration.
# Dev builds target the current OS only; the runtime (Node + dsh) is bundled
# per ADR-002 once Task 1.4's prepare-runtime lands (see scripts/prepare-runtime.mjs).

appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - resources/**/*
  - "!**/*.map"

# App icon (generated by scripts/generate-icon.mjs): 512px PNG + .icns.
# Windows uses the 512px PNG (electron-builder converts to .ico automatically).

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # code signing secrets land in CI (Task 5.2); local builds run unsigned.
  identity: null

win:
  icon: build/icon.png
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
