# Desktop custom-shell tool enablement (applied after dsh-web-app bundle):
# the web surface disables the base toolset; the desktop shell re-enables it
# so the custom UI has the same tools as headless/base profiles.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'

# ── auto-execute tools: approval never, filesystem stays workspace-scoped ──
# The web surface defaults to DSH_PERMISSION_MODE=workspace-write → tool
# execution requires approval. The desktop shell auto-executes tools (no
# approval interruption) while keeping the sandbox workspace-scoped.
# The composed knobs must match a named preset, so define a desktop one and
# make it the default for new sessions.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      desktop-auto:
        sandbox: workspace-write
        approval: never
        name: Desktop auto-execute
        description: Tools run automatically; file changes stay in the workspace
    defaultPreset: desktop-auto
