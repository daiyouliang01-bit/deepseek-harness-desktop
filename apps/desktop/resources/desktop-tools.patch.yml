# Desktop custom-shell tool enablement (applied after dsh-web-app bundle):
# the web surface disables the base toolset; the desktop shell re-enables it
# so the custom UI has the same tools as headless/base profiles.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'

# ── auto-execute tools: approval never, filesystem stays workspace-scoped ──
# The web surface defaults to DSH_PERMISSION_MODE=workspace-write → tool
# execution requires approval. The desktop shell auto-executes tools (no
# approval interruption) while keeping the sandbox workspace-scoped.
# The composed knobs must match a named preset, so define a desktop one and
# make it the default for new sessions.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      desktop-auto:
        sandbox: workspace-write
        approval: never
        name: Desktop auto-execute
        description: Tools run automatically; file changes stay in the workspace
    defaultPreset: desktop-auto

# Two `web` profile processes cannot both own the task-board ledger.
# The GUI `dsh web` on :3080 already holds it; disable the board here so
# the desktop harness can boot alongside and still load dsh-xai / SuperGrok.
- id: web-ui-task-board
  disabled: true

# ── phone access (Task 7.2): Cloudflare quick tunnel + mobile view ──
# @dshd/phone-sync must be linked into the web profile's node_modules
# (the app does this automatically at startup via phone-sync-installer.ts).
- id: phone-sync
  name: '@dshd/phone-sync'

# Coding Agent host row. Must be an insert: overlay-by-id is a no-op when
# the profile has never created this id (phone-sync is inserted in the
# profile patch first; this plugin is not).
- insert:
    - id: coding-agent
      name: '@dshd/coding-agent-host'
    - id: desktop-chrome
      name: '@dshd/desktop-chrome'
